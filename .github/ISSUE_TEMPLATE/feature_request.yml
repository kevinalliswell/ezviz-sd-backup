name: 功能建议 / Feature request
description: 提出一个具体使用场景或设计改进
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与问题
      description: 描述需要完成的事情和当前方案的限制，不包含私人设备信息。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议及验收标准
      description: 预期行为、资源成本、依赖及如何证明改进有效。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他可行方式
      description: 是否能通过简化配置或文档满足需求？
